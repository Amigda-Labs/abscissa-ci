[project]
name = "abscissa-ci"
version = "0.1.0"
description = "Service-first construction intelligence workflows for Abscissa CI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.0.17",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
]

[project.scripts]
abscissa-tile = "abscissa_ci.cli:app"
abscissa-serve = "abscissa_ci.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abscissa_ci"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "agent: requires ABSCISSA_TILE_ENGINEER_API_KEY or OPENAI_API_KEY and OpenAI Agents SDK image access",
]
